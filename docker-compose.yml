services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: newswatch
      POSTGRES_PASSWORD: newswatch
      POSTGRES_DB: newswatch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U newswatch -d newswatch"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://newswatch:newswatch@db:5432/newswatch
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://newswatch:newswatch@db:5432/newswatch
    command: ["newswatch", "run", "--interval", "900"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
